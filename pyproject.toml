[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icpipe"
version = "0.1.0"
description = "Initial-condition (IC) analysis utilities for SWIFT/MUSIC2 cosmological simulations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cosmo-pipeline contributors" }]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "h5py>=3.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "mcfit"]
test = ["pytest>=7"]

[project.scripts]
make-music-conf = "icpipe.cli.make_music_conf:main"
make-monofonic-conf = "icpipe.cli.make_monofonic_conf:main"
make-rbins = "icpipe.cli.make_rbins:main"
compute-pk = "icpipe.cli.compute_pk:main"
compute-pv = "icpipe.cli.compute_pv:main"
plot-ic = "icpipe.cli.plot_ic:main"
run-pipeline = "icpipe.cli.run_pipeline:main"

[tool.setuptools]
packages = ["icpipe", "icpipe.cli"]

[tool.pytest.ini_options]
testpaths = ["icpipe/tests"]
