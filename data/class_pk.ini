# CLASS input for matter power spectrum P(k) output
# Usage: ./music_build/_deps/class-build/class class_pk.ini
# Output: class_pk_z{z}.dat in the current directory
#
# Cosmology matches CV_22 (Illustris/TNG cosmology)
# To change redshift: edit z_pk below

root = class_pk_z45_
output = mPk
h = 0.6711
Omega_b = 0.049
Omega_cdm = 0.251
Omega_k = 0
N_ur = 3.046
N_ncdm = 0
P_k_ini type = analytic_Pk
sigma8 = 0.8
n_s = 0.9624
T_cmb = 2.7255
YHe = 0.245421
reio_parametrization = reio_none
P_k_max_h/Mpc = 20
z_pk = 45
k_per_decade_for_pk = 100
k_per_decade_for_bao = 100
background_verbose = 0
thermodynamics_verbose = 0
perturbations_verbose = 0
spectra_verbose = 0
output_verbose = 0
