# MUSIC2-monofonIC config template for cosmo-sim.
# Cosmology matches conf/CV_22_MUSIC_template.conf so the two IC codes can be
# compared at identical cosmology + box + seed (PLT validation).
# GridRes, BoxLength, zstart, LPTorder, DoFixing, seed, NumThreads and the
# output filename are filled in by make_monofonic_conf.py.

[setup]
GridRes         = {GRIDRES}      # cells per side = particles per side for the 'sc' load
BoxLength       = {BOXLENGTH}    # Mpc/h
zstart          = {ZSTART}       # starting redshift
LPTorder        = {LPTORDER}     # 1, 2, or 3 (monofonIC default 3)
DoBaryons       = no
DoBaryonVrel    = no
DoFixing        = {DOFIXING}     # Angulo & Pontzen amplitude fixing (matches MUSIC fix_mode_amplitude)
DoInversion     = no             # phase inversion for the paired partner
DoRemoveCornerModes = no
ParticleLoad    = sc             # 1x load: one particle per grid cell

[cosmology]
ParameterSet    = none           # set parameters explicitly below (match the MUSIC template)
Omega_m         = 0.3
Omega_b         = 0.049
Omega_L         = 0.7
H0              = 67.11
n_s             = 0.9624
sigma_8         = 0.8
Tcmb            = 2.7255
N_ur            = 3.046
m_nu1           = 0.0
m_nu2           = 0.0
m_nu3           = 0.0
w_0             = -1.0
w_a             = 0.0
ZeroRadiation   = true           # back-scale with Omega_r=0 growth (matches MUSIC + SWIFT background)
transfer        = CLASS
ztarget         = 0.0            # CLASS output at ztarget is back-scaled to zstart
TransferComponent = matter       # total-matter source (Michaux+2020 back-scaling convention)

[random]
generator       = NGENIC
seed            = {SEED}

[execution]
NumThreads      = {NTHREADS}

[output]
format          = SWIFT
filename        = {FILENAME}
UseLongids      = true
