[setup]
boxlength		  = 25  # in Mpc/h
zstart			  = 127   # redshift of the initial conditions
levelmin		  = 8    # minimum level of refinement
levelmin_TF		= 8    # minimum level of refinement for perturbation grid
levelmax		  = 8    # maximum level of refinement
padding			  = 8    # number of cells used for padding
ref_center		= 0.5, 0.5, 0.5
ref_extent		= 0.2, 0.2, 0.2
align_top		  = no
baryons			  = no
use_2LPT		  = yes

[cosmology]
Omega_m			= 0.3
Omega_L			= 0.7
w_0			    = -1.0
w_a			    = 0.0
Omega_b			= 0.049
H0			    = 67.11
sigma_8			= 0.8
n_s			    = 0.9624
Tcmb            = 2.7255
k_p             = 0.05
N_ur            = 3.046
m_nu1           = 0.00
m_nu2           = 0.0
m_nu3           = 0.0
ZeroRadiation   = true
transfer        = CLASS          
ztarget         = 0.0             # target redshift for CLASS module, output at ztarget will be back-scaled to zstart

[random]
seed[7]			= 66345
seed[8]			= 23346
seed[9]			= 34667
seed[10]		= 46238
seed[11]		= 56789
seed[12]		= 67890
rngfname        = data/wnoise_0008.bin


[output]
##generic MUSIC data format (used for testing)
##requires HDF5 installation and HDF5 enabled in Makefile
#format			= generic
#filename		= debug.hdf5

## AREPO data format
## requires HDF5 installation and HDF5 enabled in Makefile
#format			= arepo
#filename		= ics_arepo.hdf5

## SWIFT data format
## requires HDF5 installation and HDF5 enabled in Makefile
format			= swift
filename		= ics_swift.hdf5

## RAMSES format (compatible with Bertschinger's grafic2)
## option 'ramses_nml'=yes writes out a startup nml file
#format			= grafic2	
#filename		= ics_ramses
#ramses_nml	= yes

## ENZO - also outputs the settings for the parameter file
## requires HDF5 installation and HDF5 enabled in Makefile
#format			= enzo
#filename		= ic.enzo

## TIPSY format compatible with PKDgrav and Gasoline
#format			= tipsy
#filename		= ics_tipsy.dat

## NYX compatible output format
##requires boxlib installation and boxlib enabled in Makefile
#format			= nyx
#filename		= init

## Gadget-2 (type=1: high-res particles, type=5: rest) - old bunary format
#format			= gadget2
#filename		= ics_gadget.dat

## GAMER-2 compatible output format
#format     = gamer2
#filename   = UM_IC
#parfilename = PAR_IC


